# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake and SonarQube

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache gtest
      uses: actions/cache@v4
      id: cache-gtest
      with:
        path: ~/gtest
        key: ${{ runner.os }}-gtest-latest

    - name: Install gtest
      env:
        CACHE_HIT: ${{steps.cache-gtest.outputs.cache-hit}}
      run: |
        if [[ "$CACHE_HIT" == 'true' ]]; then
          cd ~/gtest
          sudo cp lib/*.a /usr/lib
          sudo cp -R ~/gtest/* /usr
        else
          git clone https://github.com/google/googletest.git
          cd googletest
          mkdir build
          cd build
          cmake ..
          cmake --build .
          mkdir -p ~/gtest
          cmake --install . --prefix ~/gtest
          cd ~/gtest
          sudo cp lib/*.a /usr/lib
          sudo cp -R ~/gtest/* /usr
        fi

    - name: Install DebugTrace
      run: |
        mkdir -p ${{github.workspace}}/DebugTrace/build
        cd ${{github.workspace}}/DebugTrace/build
        cmake -Wno-dev -DCMAKE_INSTALL_PREFIX=/usr -S ..
        cmake --build . --parallel $(nproc)
        sudo cmake --install .

    - name: Install TypeTraits
      run: |
        mkdir -p ${{github.workspace}}/TypeTraits/build
        cd ${{github.workspace}}/TypeTraits/build
        cmake -Wno-dev -DCMAKE_INSTALL_PREFIX=/usr -S ..
        cmake --build . --parallel $(nproc)
        sudo cmake --install .

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --test-dir ${{github.workspace}}/build -C ${{env.BUILD_TYPE}} --output-on-failure

  sonar:
    needs: build
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: build_sonar
      BUILD_TYPE: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl unzip gcov lcov

      - name: Cache gtest
        uses: actions/cache@v4
        id: cache-gtest
        with:
          path: ~/gtest
          key: ${{ runner.os }}-gtest-latest

      - name: Install gtest
        env:
          CACHE_HIT: ${{steps.cache-gtest.outputs.cache-hit}}
        run: |
          if [[ "$CACHE_HIT" == 'true' ]]; then
            cd ~/gtest
            sudo cp lib/*.a /usr/lib
            sudo cp -R ~/gtest/* /usr
          else
            git clone https://github.com/google/googletest.git
            cd googletest
            mkdir build
            cd build
            cmake ..
            cmake --build .
            mkdir -p ~/gtest
            cmake --install . --prefix ~/gtest
            cd ~/gtest
            sudo cp lib/*.a /usr/lib
            sudo cp -R ~/gtest/* /usr
          fi

      - name: Install DebugTrace
        run: |
          mkdir -p ${{github.workspace}}/DebugTrace/build
          cd ${{github.workspace}}/DebugTrace/build
          cmake -Wno-dev -DCMAKE_INSTALL_PREFIX=/usr -S ..
          cmake --build . --parallel $(nproc)
          sudo cmake --install .

      - name: Install TypeTraits
        run: |
          mkdir -p ${{github.workspace}}/TypeTraits/build
          cd ${{github.workspace}}/TypeTraits/build
          cmake -Wno-dev -DCMAKE_INSTALL_PREFIX=/usr -S ..
          cmake --build . --parallel $(nproc)
          sudo cmake --install .

      - name: Install Sonar build-wrapper
        run: |
          curl -sSLo build-wrapper.zip https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -q build-wrapper.zip
          echo "${PWD}/build-wrapper-linux-x86" >> "$GITHUB_PATH"

      - name: Configure CMake
        run: |
          cmake -S . -B "${{env.BUILD_DIR}}" -G Ninja -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build (captured by build-wrapper)
        run: |
          build-wrapper-linux-x86-64 --out-dir bw-output cmake --build "${{env.BUILD_DIR}}" --parallel

      - name: Run tests for coverage
        run: |
          ctest --test-dir "${{env.BUILD_DIR}}" -C "${{env.BUILD_TYPE}}" --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --directory "${{env.BUILD_DIR}}" --capture --output-file coverage.lcov
          lcov --remove coverage.lcov '/usr/*' '**/test/*' '**/googletest/*' --output-file coverage.lcov

      - name: Convert coverage to gcov format
        run: |
          mkdir -p gcov-reports
          cd "${{env.BUILD_DIR}}"
          find . -name "*.gcda" | while read gcda; do
            gcov -p "$gcda"
          done
          mv *.gcov ../gcov-reports/ || true

      - name: Sonar scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.sources=include,test
            -Dsonar.cfamily.build-wrapper-output=bw-output
            -Dsonar.cfamily.gcov.reportPaths=coverage.lcov
